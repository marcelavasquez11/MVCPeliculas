services:

  # Contenedor de la aplicación ASP.NET MVC
  peliculas-app:
    build: .
    ports:
      - "8081:8080"
    depends_on:
      - peliculas-db
    # Cadena de conexión hacia el contenedor de SQL Server
    environment:
      - ConnectionStrings__DefaultConnection=Server=peliculas-db;Database=Peliculas;User Id=sa;Password=Your_password123!;TrustServerCertificate=True


  # Contenedor de SQL Server
  peliculas-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Your_password123!
    ports:
      - "1433:1433"
    # Mantiene los datos de SQL Server aunque el contenedor se elimine
    volumes:
      - sql-data:/var/opt/mssql


# Volumen utilizado para almacenar los datos de la base de datos
volumes:
  sql-data: